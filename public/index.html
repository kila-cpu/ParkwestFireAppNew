<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parkwest Installer Guide</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8102E; --red-dk:#9E0B22; --ink:#1B1C1E; --paper:#F5F4F1; --surface:#FFFFFF; --line:#DEDAD3;
  --muted:#565961; --soft:#EDEAE4; --ok-bg:#DCE8FB; --ok:#173E80; --warn-bg:#FFF1DC; --warn:#6B3600; --warn-line:#B85C00;
  --err:#B3261E; --err-bg:#FDECEA; --good:#1E6B3A; --good-bg:#DFF2E5;
  --dark:#1B1C1E; --nav-on:#C8102E; --max:760px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#ECECEC; --paper:#141516; --surface:#1F2022; --line:#35373B; --muted:#A9ACB2; --soft:#2A2B2E;
    --ok-bg:#1C2D4A; --ok:#B9D0F7; --warn-bg:#3A2A14; --warn:#F5C98E; --warn-line:#D98A2B; --err:#FF8A80; --err-bg:#3A1A18; --good:#9BDDB0; --good-bg:#16301F; --dark:#0E0F10; --nav-on:#FF6B7F; }
}
:root[data-theme="dark"]{ --ink:#ECECEC; --paper:#141516; --surface:#1F2022; --line:#35373B; --muted:#A9ACB2; --soft:#2A2B2E;
  --ok-bg:#1C2D4A; --ok:#B9D0F7; --warn-bg:#3A2A14; --warn:#F5C98E; --warn-line:#D98A2B; --err:#FF8A80; --err-bg:#3A1A18; --good:#9BDDB0; --good-bg:#16301F; --dark:#0E0F10; --nav-on:#FF6B7F; }
html{scroll-padding-top:150px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #5B9BF0;outline-offset:2px}
img{max-width:100%}
.wrap{max-width:var(--max);margin:0 auto;padding:0 16px 150px}
.top{background:#fff;border-bottom:1px solid #E2DED6;position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:var(--max);margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:46px;width:auto;display:block}
.tag{font:700 14px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;padding:5px 8px;border-radius:6px;background:#1B1C1E;color:#fff;white-space:nowrap}
.tabs{display:none}
.trial{background:var(--warn-bg);color:var(--warn);font-size:14px;padding:8px 16px;border-bottom:1px solid var(--line)}
.trial-in{max-width:var(--max);margin:0 auto}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;line-height:1.05;margin:0}
h1{font-size:32px} h2{font-size:24px} h3{font-size:20px}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.btn{color:inherit;min-height:48px;padding:0 18px;border-radius:10px;border:2px solid var(--ink);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:44px}
.btn.ghost{border-color:transparent;background:none;text-decoration:underline}
.btn:disabled{opacity:.55;cursor:default}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--ink);background:var(--surface);font-weight:600}
.chip.on{background:var(--ink);color:var(--paper)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 8px;border-radius:6px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.grey{background:var(--soft);color:var(--muted)}
.badge.good{background:var(--good-bg);color:var(--good)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.note{font-size:14px;margin:0;padding:10px 12px;border-radius:10px;background:var(--ok-bg);color:var(--ok)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.warnbox{background:var(--warn-bg);border:2px solid var(--warn-line);border-radius:12px;padding:14px;color:var(--warn)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;gap:10px;align-items:flex-start}
.dot{flex:0 0 22px;height:22px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.linkbtn{background:none;border:none;padding:0;color:inherit;text-decoration:underline;font-weight:700}
input[type=text],input[type=number],input[type=search],textarea.f{min-height:48px;padding:0 12px;border-radius:10px;border:1px solid #B9B3A8;background:var(--surface);width:100%}
textarea.f{padding:10px 12px;min-height:64px;resize:vertical}
.spin{width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s 0.8s linear infinite;display:inline-block;flex:0 0 auto}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.desk-only{display:none}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
.nav-in{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.nav button{background:none;border:none;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--muted)}
.nav button.on{color:var(--nav-on);font-weight:700}

/* stepper */
.stepper{position:sticky;top:calc(63px + env(safe-area-inset-top,0px));z-index:15;background:var(--paper);margin:0 -16px;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.stepper ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stepper li button{width:100%;background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);text-align:center;line-height:1.1}
.stepper li button:disabled{cursor:default}
.stepper .n{width:28px;height:28px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.stepper li.done .n{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.stepper li.cur .n{background:var(--red);border-color:var(--red);color:#fff}
.stepper li.cur button{color:var(--ink);font-weight:700}
.stephead{display:flex;flex-direction:column;gap:4px}
.stephead .eyebrow{font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--red)}

/* step 1-2 */
.two{display:flex;flex-direction:column;gap:12px}
.drop{border:2px dashed #8A857C;border-radius:14px;padding:28px 16px;text-align:center;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer}
.drop.over{border-color:var(--red);background:var(--warn-bg)}
.drop .hint-desk{display:none}
.scanimg{border-radius:12px;max-height:340px;object-fit:cover;width:100%;background:var(--soft);display:block}
.seen{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.seen li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.seen li:first-child{border-top:none}
.seen .k{color:var(--muted)}
.seen .v{font-weight:700;text-align:right}
.seen .v.no{color:var(--muted);font-weight:500}

/* step 3 form */
.form{display:grid;grid-template-columns:1fr;gap:10px}
.field{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.field .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field .lab strong{font-size:17px}
.req{font-size:12px;font-weight:700;color:var(--red)}
.opt{font-size:12px;color:var(--muted)}
.field.photo{border-color:var(--warn-line);background:var(--warn-bg)}
.field.photo .from{font-size:12px;font-weight:700;color:var(--warn)}
.field.miss{border:2px solid var(--err);background:var(--err-bg)}
.field.miss .lab strong::after{content:" — needed";color:var(--err);font-size:14px}
.field .help{font-size:13px;color:var(--muted);margin:0}
.numrow{display:flex;gap:8px;align-items:center}
.numrow input{max-width:160px}
.numrow .x{font-weight:700}
.actionbar{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:14;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,.08);margin-top:6px}
.actionbar .msg{flex:1;font-size:14px}
.actionbar .btn{flex:0 0 auto}
details.desc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.desc summary{font-weight:700;cursor:pointer}

/* step 4 results */
.yours{display:flex;flex-wrap:wrap;gap:6px}
.yours span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:14px;font-weight:600}
.results{display:grid;grid-template-columns:1fr;gap:12px}
.result{border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.result .body{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.result .body .btn{margin-top:auto}
.thumb{width:100%;height:180px;object-fit:contain;background:#fff;border-bottom:1px solid var(--line);display:block}
.insline{border-radius:10px;padding:8px 10px;background:var(--soft);font-size:15px}
.insline b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .chip{flex:0 0 auto}

/* step 5 review */
.callout{border-radius:12px;padding:14px;border:2px solid var(--ok);background:var(--ok-bg);color:var(--ok);display:flex;flex-direction:column;gap:6px}
.callout h3{color:inherit}
.callout.warn{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn)}
.callout.none{border-color:var(--line);background:var(--surface);color:var(--ink)}
.method{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.method li{border-top:1px solid var(--line)}
.method li:first-child{border-top:none}
.method label{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 0;cursor:pointer;align-items:start}
.method input{width:26px;height:26px;margin:0;accent-color:var(--good)}
.method .t{font-weight:700;display:block}
.method .x{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.method .q{display:block;font-size:14px;font-weight:700;color:var(--ok);margin-top:4px}
.method li.ticked .t{text-decoration:line-through;color:var(--muted)}
.progress{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--good);transition:width .2s}
.mats{width:100%;border-collapse:collapse;font-size:15px}
.mats td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.mats tr:first-child td{border-top:none}
.mats td.qty{text-align:right;font-weight:700;white-space:nowrap;padding-left:12px}
.drawing{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:auto;-webkit-overflow-scrolling:touch}
.drawing img{display:block;width:100%;height:auto}
.drawing.zoom img{width:220%;max-width:none}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.full{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
table.full th,table.full td{padding:8px 10px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
table.full th{background:var(--soft);border-top:none}
table.full tr.hit td{background:var(--ok-bg);font-weight:700}
.donebox{border-radius:12px;padding:14px;background:var(--good-bg);color:var(--good);border:2px solid var(--good);font-weight:700}

/* library */
.libgrid{display:grid;grid-template-columns:1fr;gap:8px}
.libitem{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%}
.libitem:hover{border-color:var(--ink)}
.libitem img{width:96px;height:72px;object-fit:contain;background:#fff;border-radius:6px}
.libitem .kinds{display:flex;gap:4px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#1B1C1E;color:#fff;padding:12px 16px;border-radius:10px;z-index:50;max-width:90%}

@media (max-width: 420px){ .stepper .lbl{font-size:11px} }

.badge.prod{background:var(--dark);color:#fff}
.guides{display:grid;grid-template-columns:1fr;gap:8px}
.guidecard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.guidecard:hover{border-color:var(--ink)}
.guidecard.on{border:2px solid var(--red)}
.gsteps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px}
details summary{cursor:pointer}
details.guidebox summary{list-style-position:outside}
@media (min-width: 600px){ .guides{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width: 900px){ .guides{grid-template-columns:repeat(3,minmax(0,1fr))} }
/* ---------- desktop ---------- */
@media (min-width: 900px){
  :root{--max:1200px}
  .nav{display:none}
  .wrap{padding-bottom:64px}
  .tabs{display:flex;gap:4px;margin-left:auto;margin-right:12px}
  .tabs button{background:none;border:none;border-radius:8px;min-height:44px;padding:0 14px;display:flex;align-items:center;gap:8px;font-weight:600;color:#565961}
  .tabs button:hover{background:#F0EDE8}
  .tabs button.on{color:#C8102E;background:#FBE9EC}
  .toast{bottom:24px}
  .stepper{margin:0;padding:14px 0 12px;border-bottom:none;background:var(--paper)}
  .stepper ol{gap:0}
  .stepper li button{flex-direction:row;justify-content:flex-start;gap:8px;font-size:15px}
  .actionbar{bottom:16px}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form .wide{grid-column:1 / -1}
  .results{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .review{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
  .review .side{position:sticky;top:150px}
  .libgrid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
  .drop{padding:48px 24px}
  .drop .hint-desk{display:block}
  .desk-only{display:initial}
  .btn.desk-only{display:inline-flex}
  .mob-only{display:none!important}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <img src="logo.png" alt="Parkwest Fire Protection">
  <nav class="tabs" aria-label="Main">
    <button data-go="scan" id="t-scan"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="4"/><path d="M4 8h3l2-3h6l2 3h3v12H4z"/></svg>Scan</button>
    <button data-go="find" id="t-find"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Find</button>
    <button data-go="library" id="t-library"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15 5l4 1-3 14-4-1z"/></svg>Library</button>
  </nav>
  <span class="tag">Installer Guide</span>
</div></header>
<div class="trial"><div class="trial-in">Demo version. Details are read automatically from the six Protecta guides — always check the drawing and the guide before installing.</div></div>
<main class="wrap" id="app" aria-live="polite"></main>
<nav class="nav" aria-label="Main"><div class="nav-in">
 <button data-go="scan" id="n-scan"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="4"/><path d="M4 8h3l2-3h6l2 3h3v12H4z"/></svg>Scan</button>
 <button data-go="find" id="n-find"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Find</button>
 <button data-go="library" id="n-library"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15 5l4 1-3 14-4-1z"/></svg>Library</button>
</div></nav>
<div id="toast" class="toast hide" role="status"></div>
<input type="file" accept="image/*" capture="environment" id="camfile" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" accept="image/*" id="pickfile" class="sr" tabindex="-1" aria-hidden="true">
<script>
let LIB = [], GUIDES = [], byId = {}, guideBy = {};
function img(id){ return `drawings/${id}.webp`; }
const isDesk = () => window.matchMedia("(min-width: 900px)").matches;

/* ---------- fields ---------- */
const SERVICES = [["copper","Copper pipe"],["steel","Steel / iron / gas pipe"],["alupex","Alupex / multilayer pipe"],["pex","PEX pipe-in-pipe"],["plastic","Plastic pipe"],["cables","Cables / cable tray"],["conduit","Conduit"],["busbar","Bus-bar"],["trunking","Trunking / duct"],["unistrut","Unistrut channel"],["linear","Linear joint (gap seal)"],["empty","Empty hole (no service)"],["mixed","Several services in one hole"]];
const SVC_NAME = Object.fromEntries(SERVICES);
const KIND_SHORT = {copper:"Copper",steel:"Steel",alupex:"Alupex",pex:"PEX",plastic:"Plastic",cables:"Cables",conduit:"Conduit",busbar:"Bus-bar",trunking:"Trunking",unistrut:"Unistrut",linear:"Linear joint",empty:"Empty hole"};
const WALLS = [["Drywall","Drywall / stud partition"],["Rigid","Block, brick or concrete"],["Timber","Timber stud wall"],["Panel","Sandwich panel wall"]];
const FLOORS = [["Rigid","Concrete floor"],["Timber","Timber floor"],["Flexible","Joisted floor with ceiling"],["Composite","Composite floor (steel deck)"]];
const WALL_NAME = Object.fromEntries(WALLS), FLOOR_NAME = Object.fromEntries(FLOORS);
const PLASTICS = [["PVC","PVC-U / PVC-C"],["PE","PE, ABS or SAN+PVC"],["PP","PP"],["PB","Polybutylene (PB)"],["Composite","Composite / acoustic (branded)"]];
const BRANDS = ["Aquatherm Green SDR9","BluePower","Geberit Silent-PP","Huliot Ultra Silent","LK PAL Universal","Polo-Kal NG","Rehau Raupiano Plus","Uponor Decibel","Valsir Blackfire","Valsir PP3","Valsir Triplus","Wavin AS+","Wavin SiTech"];
const INSUL = [["","Not sure"],["none","None — bare pipe"],["elastomeric","Elastomeric (Armaflex)"],["pe","PE foam"],["phenolic","Phenolic foam"],["pu","PU foam"],["stone","Stone wool"],["glass","Glass wool"]];
const INS_NAME = {none:"Bare pipe",elastomeric:"Elastomeric",pe:"PE foam",phenolic:"Phenolic foam",pu:"PU foam",stone:"Stone wool",glass:"Glass wool",any:"Pipe insulation"};
const RATINGS = [20,30,45,60,90,120,180,240];
const SIZED = ["copper","steel","alupex","pex","plastic","cables","conduit"];
const INSULABLE = ["copper","steel","alupex","pex","plastic"];
const DIA_CHIPS = {copper:[15,22,28,35,42,54,89],steel:[22,40,63,110,168,219,324],alupex:[16,20,32,50,75],pex:[25,32,54],plastic:[40,50,110,125,160,200],cables:[21,50,80,100],conduit:[16,20,25,32,40]};
const FIELDS = {
  surface:{label:"Wall or floor"}, base:{label:"Wall type"}, thk:{label:"Thickness"}, service:{label:"Service type"},
  dia:{label:"Outside diameter (Ø)"}, plasticMat:{label:"Plastic type"}, brand:{label:"Pipe brand"},
  insulation:{label:"Insulation already on the pipe"}, rating:{label:"Fire rating needed"}, opening:{label:"Opening size"}

const STEPS = ["Photo","Read","Details","Matches","Install"];

  else if (/\b(half an hour|half hour)/.test(t)) mins = 30;
  else if (/\b(an|one) hour\b/.test(t)) mins = 60;
  else if (/\btwo hours?\b/.test(t)) mins = 120;
  else if (/\bthree hours?\b/.test(t)) mins = 180;
  else if (/\bfour hours?\b/.test(t)) mins = 240;
  if (mins){ r.rating = RATINGS.find(x => x >= mins) || 240; if (m) t = t.replace(m[0], " "); }
  const thk = t.match(new RegExp(`(\\d{2,3})\\s*(?:mm|mil|mils|millimet\\w*)?\\s*(?:thick\\s*)?(?:\\w+\\s+){0,2}?(?:${WALL_WORDS})`))
    || t.match(new RegExp(`(?:${WALL_WORDS})\\w*\\s+(?:of\\s+|is\\s+)?(\\d{2,3})\\s*(?:mm|mil|mils)?(?!\\s*(?:mm\\s*)?(?:${SVC_WORDS}))\\b`));
  if (thk){ r.thk = +thk[1]; t = t.replace(thk[1], " "); }
  const dia = t.match(/(?:ø|dia\w*|od)\s*(\d{1,3})/) || t.match(new RegExp(`(\\d{1,3})\\s*(?:mm|mil)?\\s*(?:od\\s*)?(?:\\w+\\s+){0,1}?(?:${SVC_WORDS})`));
  if (dia && SIZED.includes(r.service)) r.dia = +dia[1];
  const jw = r.service === "linear" && t.match(/(\d{1,3})\s*(?:mm)?\s*(?:wide|gap|joint)/);
  if (jw){ r.openW = +jw[1]; delete r.openH; }
  for (const k of Object.keys(r)) if (r[k] === undefined) delete r[k];
  return r;
}
function readText(){
  const text = S.askText.trim();
  if (!text){ toast("Type what you’re sealing first."); return; }
  const r = parseText(text);
  if (!Object.keys(r).length){ S.note = {warn:true, text:"Couldn’t pick anything out of that — fill in the boxes instead."}; render(); return; }
  for (const k of Object.keys(r)){ S.q[k] = r[k]; delete S.fromPhoto[k === "openW" || k === "openH" ? "opening" : k]; }
  if (r.service && r.service !== "plastic"){ delete S.q.plasticMat; delete S.q.brand; }
  const n = Object.keys(r).filter(k => k !== "openH").length;
  S.note = {text:`Filled in ${n} box${n>1?"es":""} from your description — check them below.`};
  render();
}

  return `<div class="stack">
    ${top}
    <div class="row">${guideBadge(d)}<span class="badge ok">✓ From the Protecta guide</span></div>
    <h1 style="font-size:28px">${esc(d.title)}</h1>
    <p class="muted" style="margin:0">${esc(d.cons)}</p>
    <div class="review">
      <div class="stack">
        ${yours}
        <section class="callout ${ins.cls}"><span class="small" style="font-weight:700;text-transform:uppercase;letter-spacing:.3px">Insulation</span><h3>${esc(ins.title)}</h3><p style="margin:0">${esc(ins.text)}</p></section>
        <section class="card stack" id="method">
          <div class="row" style="justify-content:space-between"><h3>What needs to be done</h3><span class="small muted" id="prog-t">${nDone} of ${steps.length} done</span></div>
          <div class="progress" aria-hidden="true"><i id="prog" style="width:${Math.round(nDone/steps.length*100)}%"></i></div>
          <ol class="method">${steps.map((s,i) => `<li class="${done[i]?"ticked":""}"><label><input type="checkbox" data-tick="${i}" data-key="${esc(key)}" ${done[i]?"checked":""}><span><span class="t">${i+1}. ${esc(s.t)}</span><span class="x">${esc(s.x)}</span>${s.q?`<span class="q">${esc(s.q)}</span>`:""}</span></label></li>`).join("")}</ol>
          <div id="donebox">${nDone === steps.length ? doneBox() : ""}</div>
        </section>
        <section class="card stack"><h3>What you’ll need</h3>
          <table class="mats"><tbody>${qty.map(([a,n,x]) => `<tr><td><strong>${esc(a)}</strong><br><span class="small muted">${esc(x)}</span></td><td class="qty">${esc(n)}</td></tr>`).join("")}</tbody></table>
          <p class="small muted" style="margin:0">Quantities are a rough guide${q.openW?` for your ${valText("opening", q)} opening`:""} — check against the drawing.</p>
        </section>
        ${tbl}
        <section class="card stack"><h3>Exactly as written on the drawing</h3><ul class="list">${d.callouts.map(c => `<li><span class="dot">•</span><span>${esc(c)}</span></li>`).join("")}</ul></section>
        <details class="card guidebox"><summary><strong>General instructions — ${esc(g.name)}</strong><span class="small muted"> · ${g.steps.length} steps from page 1 of the guide</span></summary>
          <div class="stack" style="margin-top:10px">
            <ol class="gsteps">${g.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
            ${g.rules.map(r => `<div><strong>${esc(r.k)}</strong><p class="small" style="margin:4px 0 0">${esc(r.t)}</p></div>`).join("")}
          </div></details>
      </div>
      <div class="side stack">
        <section class="card stack"><h3>Drawing</h3>
          <div class="drawing ${S.zoom?"zoom":""}"><img src="${img(d.id)}" alt="Installation drawing: ${esc(d.title)}"></div>
          <div class="row"><button class="btn sm" data-act="zoom">${S.zoom?"Fit to screen":"Zoom drawing"}</button><a class="btn sm" href="${g.file}#page=${d.page}" target="_blank" rel="noopener">Open guide p.${d.page}</a></div>
        </section>
        <section class="card"><dl class="kv">${facts.map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl></section>
        ${mode === "install" ? `<div class="row"><button class="btn sm" data-step="4">← Other matches</button><button class="btn sm" data-act="newSearch">New search</button></div>` : ""}
      </div>
    </div>
  </div>`;
}
function doneBox(){ return `<div class="donebox">All steps ticked. Photograph both sides and fit the label as normal.</div>`; }

/* ---------- library ---------- */
function libMatches(){
  const terms = S.libSearch.toLowerCase().replace(/ø/g,"").replace(/\bei\s+(\d)/g,"ei$1").split(/\s+/).filter(Boolean);
  return LIB.filter(d => {
    if (S.libGuide !== "all" && d.guide !== S.libGuide) return false;
    if (S.libKind !== "all" && !d.kinds.includes(S.libKind)) return false;
    if (!terms.length) return true;
    const hay = d._hay || (d._hay = [d.title, d.cons, d.kinds.map(k => SVC_NAME[k]).join(" "), guideBy[d.guide].name, d.code||"", "p" + d.page, d.mats.join(" "), d.callouts.join(" "),
      d.walls.map(w => WALL_NAME[w]).join(" "), d.floors.map(f => FLOOR_NAME[f]).join(" "), /elastomeric/i.test(d.callouts.join(" ")) ? "armaflex kaiflex" : "", /stone wool/i.test(d.callouts.join(" ")) ? "rockwool" : ""].join(" ").toLowerCase());
    const nums = [d.ei, d.maxDia, d.minThk, ...(d.opts||[]).flatMap(o => [o.dia, o.ei])];
    return terms.every(t => /^(ei)?\d+$/.test(t) ? (t.startsWith("ei") ? d.ei == t.slice(2) || (d.opts||[]).some(o => o.ei == t.slice(2)) : nums.includes(Number(t))) : hay.includes(t));
  });
}
function libListHtml(){
  const items = libMatches();
  if (!items.length) return `<div class="card stack"><h3>No details match</h3><p style="margin:0" class="muted">Try fewer words, e.g. “collar pvc 110”.</p></div>`;
  const shown = items.slice(0, S.libLimit);
  return shown.map(d => `<button class="libitem" data-open="${d.id}"><img src="${img(d.id)}" alt="" loading="lazy"><span class="stack" style="gap:4px"><strong>${esc(d.title)}</strong><span class="small muted">${esc(d.cons)}</span><span class="kinds">${guideBadge(d)}<span class="badge grey">p.${d.page}</span>${d.table?`<span class="badge grey">Size table</span>`:""}</span></span></button>`).join("")
    + (items.length > shown.length ? `<button class="btn" data-act="libMore" style="grid-column:1/-1;justify-self:center">Show more (${items.length - shown.length} left)</button>` : "");
}
function libCount(){ return `${libMatches().length} of ${LIB.length} details`; }
function vLibrary(){
  const g = S.libGuide, k = S.libKind;
  const pool = LIB.filter(d => g === "all" || d.guide === g);
  const kinds = Object.keys(KIND_SHORT).filter(x => pool.some(d => d.kinds.includes(x)));
  const cards = GUIDES.map(x => `<button class="guidecard ${g===x.key?"on":""}" data-guide="${x.key}"><strong>${esc(x.name)}</strong><span class="small muted">${esc(x.blurb)}</span><span class="small"><strong>${LIB.filter(d => d.guide===x.key).length}</strong> details · ${x.pages} pages</span></button>`).join("");
  const gi = g !== "all" ? guideBy[g] : null;
  return `<div class="stack" style="padding-top:18px">
    <h1>Protecta guides</h1>
    <p class="muted" style="margin:0">Six Protecta installation guides — ${LIB.length} tested details. The search in Find only answers from these.</p>
    <div class="guides">${cards}</div>
    ${gi ? `<section class="card stack"><div class="row" style="justify-content:space-between"><h2>${esc(gi.name)}</h2><div class="row"><a class="btn sm" href="${gi.file}" target="_blank" rel="noopener">Open PDF</a><button class="btn sm" data-guide="all">Show all guides</button></div></div>
      ${gi.eta?`<p class="small muted" style="margin:0">Installation instructions to ${esc(gi.eta)}</p>`:""}
      <details><summary><strong>General instructions (${gi.steps.length} steps) and rules</strong></summary><div class="stack" style="margin-top:10px"><ol class="gsteps">${gi.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>${gi.rules.map(r => `<div><strong>${esc(r.k)}</strong><p class="small" style="margin:4px 0 0">${esc(r.t)}</p></div>`).join("")}</div></details></section>` : ""}
    <label class="sr" for="libs">Search the details</label><input type="search" id="libs" placeholder="Search, e.g. collar pvc 110, timber wall, EI 120" value="${esc(S.libSearch)}" autocomplete="off">
    <div class="chiprow" aria-label="Service">
      <button class="chip ${k==="all"?"on":""}" data-kind="all">Any service</button>
      ${kinds.map(x => `<button class="chip ${k===x?"on":""}" data-kind="${x}">${KIND_SHORT[x]} (${pool.filter(d=>d.kinds.includes(x)).length})</button>`).join("")}
    </div>
    <p class="small muted" style="margin:0" id="libcount">${libCount()}</p>
    <div class="libgrid" id="liblist">${libListHtml()}</div>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  const app = document.getElementById("app");
  let html, tab;
  if (S.view === "library"){ html = vLibrary(); tab = "library"; }
  else if (S.view === "libdetail"){ html = `<div style="padding-top:14px">${vReview(byId[S.libDetail], null, {}, "lib")}</div>`; tab = "library"; }
  else if (S.view === "ref"){ html = `<div style="padding-top:14px">${vReview(byId[S.ref], null, S.q, "ref")}</div>`; tab = "find"; }
  else {
    const body = S.step === 1 ? vPhoto() : S.step === 2 ? vRead() : S.step === 3 ? vDetails() : S.step === 4 ? vMatches() : vReview(byId[S.sel.id], S.sel.row, S.q, "install");
    html = vStepper() + `<div style="padding-top:14px">${body}</div>`;
    tab = S.step <= 2 ? "scan" : "find";
  }
  app.innerHTML = html;
  for (const n of ["find","scan","library"]){
    document.getElementById("n-"+n).classList.toggle("on", tab === n);
    document.getElementById("t-"+n).classList.toggle("on", tab === n);
  }
  const ask = document.getElementById("ask"); if (ask) ask.addEventListener("input", e => { S.askText = e.target.value; });
  const libs = document.getElementById("libs");
  if (libs) libs.addEventListener("input", e => { S.libSearch = e.target.value; S.libLimit = 60; document.getElementById("liblist").innerHTML = libListHtml(); document.getElementById("libcount").textContent = libCount(); });
  for (const el of document.querySelectorAll("[data-num]")) el.addEventListener("input", e => {
    const k = e.target.dataset.num, v = Number(e.target.value), f = k === "openW" || k === "openH" ? "opening" : k;
    if (v > 0) S.q[k] = v; else delete S.q[k];
    delete S.fromPhoto[f]; S.sel = null;
    const box = e.target.closest(".field"); box.classList.remove("photo");
    if (filled(f, S.q)) box.classList.remove("miss");
    for (const c of box.querySelectorAll(".chip.on")) c.classList.remove("on");
    const tag = box.querySelector(".from"); if (tag){ tag.className = "req"; tag.textContent = "Required"; }
    document.getElementById("bar").innerHTML = barHtml();
  });
  const drop = document.getElementById("drop");
  if (drop){
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); takePhoto(e.dataTransfer.files[0]); });
  }
}

/* ---------- events ---------- */
document.getElementById("camfile").addEventListener("change", e => { takePhoto(e.target.files[0]); e.target.value = ""; });
document.getElementById("pickfile").addEventListener("change", e => { takePhoto(e.target.files[0]); e.target.value = ""; });
document.addEventListener("change", e => {
  const t = e.target; if (!t.dataset || t.dataset.tick === undefined) return;
  const done = S.done[t.dataset.key]; done[t.dataset.tick] = t.checked;
  t.closest("li").classList.toggle("ticked", t.checked);
  const all = document.querySelectorAll("[data-tick]"), n = [...all].filter(x => x.checked).length;
  document.getElementById("prog").style.width = Math.round(n/all.length*100) + "%";
  document.getElementById("prog-t").textContent = `${n} of ${all.length} done`;
  document.getElementById("donebox").innerHTML = n === all.length ? doneBox() : "";
});
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-act]"); if (!t || t.disabled) return;
  if (t.dataset.go){
    const g = t.dataset.go;
    if (g === "library") S.view = "library";
    else if (g === "scan"){ S.view = "flow"; S.step = S.photo ? 2 : 1; }
    else { S.view = "flow"; if (S.step < 3) S.step = 3; }
    render(); scrollTop(); return;
  }
  if (t.dataset.step){ const n = +t.dataset.step; if (n === 4 && missingOf(S.q).length){ S.touched = true; go(3); return; } go(n); return; }
  if (t.dataset.set){
    const k = t.dataset.set; let v = t.dataset.val;
    if (["thk","dia","rating"].includes(k)) v = Number(v);
    if (v === "") delete S.q[k]; else S.q[k] = v;
    delete S.fromPhoto[k]; S.sel = null;
    if (k === "service"){ delete S.q.dia; delete S.q.plasticMat; delete S.q.brand; if (!INSULABLE.includes(v)) delete S.q.insulation; if (v === "linear") delete S.q.openH; }
    if (k === "plasticMat" && v !== "Composite") delete S.q.brand;
    if (k === "surface"){ delete S.q.base; delete S.fromPhoto.base; }
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.prod){ S.prodFilter = t.dataset.prod; S.showN = 24; render(); return; }
  if (t.dataset.select){ S.sel = {id:t.dataset.select, row:t.dataset.row ? JSON.parse(t.dataset.row) : null}; S.zoom = false; go(5); return; }
  if (t.dataset.ref){ S.ref = t.dataset.ref; S.view = "ref"; S.zoom = false; render(); scrollTop(); return; }
  if (t.dataset.guide){ S.libGuide = t.dataset.guide; S.libKind = "all"; S.libLimit = 60; render(); return; }
  if (t.dataset.kind){ S.libKind = t.dataset.kind; S.libLimit = 60; render(); return; }
  if (t.dataset.open){ S.libDetail = t.dataset.open; S.libY = window.scrollY; S.view = "libdetail"; S.zoom = false; render(); scrollTop(); return; }
  const a = t.dataset.act; if (!a) return;
  if (a === "camera"){ e.stopPropagation(); document.getElementById("camfile").click(); }
  if (a === "pick"){ if (t.id === "drop" && !isDesk()) return; e.stopPropagation(); document.getElementById("pickfile").click(); }
  if (a === "retake"){ S.photo = null; go(1); }
  if (a === "skipPhoto") go(3);
  if (a === "usePhoto") usePhoto();
  if (a === "ask") readText();
  if (a === "search"){
    S.touched = true; S.sel = null; S.prodFilter = "all"; S.showN = 24;
    const miss = missingOf(S.q);
    if (miss.length){ render(); const el = document.getElementById("f-" + miss[0]); if (el) el.scrollIntoView({behavior:"smooth", block:"center"}); toast(`Add the ${label(miss[0]).toLowerCase()} first.`); return; }
    go(4);
  }
  if (a === "more"){ S.showN = (S.showN || 24) + 24; render(); }
  if (a === "libMore"){ S.libLimit += 60; document.getElementById("liblist").innerHTML = libListHtml(); }
  if (a === "zoom"){ S.zoom = !S.zoom; render(); }
  if (a === "closeRef"){ S.view = "flow"; render(); scrollTop(); }
  if (a === "backLib"){ S.view = "library"; render(); window.scrollTo(0, S.libY || 0); }
  if (a === "newSearch"){ S.q = {}; S.fromPhoto = {}; S.photo = null; S.sel = null; S.touched = false; S.askText = ""; S.note = null; go(1); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "ask"){ e.preventDefault(); readText(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.id === "drop"){ e.preventDefault(); document.getElementById("pickfile").click(); }
});

async function loadLibrary(){
  try {
    const r = await fetch("library.json"); const j = await r.json();
    LIB = j.details; GUIDES = j.guides; byId = Object.fromEntries(LIB.map(d => [d.id, d])); guideBy = Object.fromEntries(GUIDES.map(g => [g.key, g]));
  } catch(e){ document.getElementById("app").innerHTML = '<div class="warnbox" style="margin-top:18px">Couldn’t load the detail library — refresh the page.</div>'; return; }
  render();
}
document.getElementById("app").innerHTML = '<div class="row" style="padding-top:24px"><span class="spin"></span><span>Loading the Protecta guides…</span></div>';
loadLibrary();
</script>
</body>
</html>
